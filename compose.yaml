services:
  solar:
    build: .
    image: solar-dashboard:local
    container_name: solar-dashboard
    user: "${SOLAR_UID:-10001}:${SOLAR_GID:-10001}"
    restart: unless-stopped
    mem_limit: 384m
    cpus: 1.0
    pids_limit: 100
    init: true
    ports:
      - "127.0.0.1:3050:3050"
    volumes:
      - ./data:/data
    environment:
      SOLAR_DATA_DIR: /data
      SOLAR_PUBLIC_ORIGIN: ${SOLAR_PUBLIC_ORIGIN:-https://solar.mockachino.app}
      SOLAR_AUTH_MODE: ${SOLAR_AUTH_MODE:-password}
      SOLAR_CF_TEAM_DOMAIN: ${SOLAR_CF_TEAM_DOMAIN:-}
      SOLAR_CF_AUD: ${SOLAR_CF_AUD:-}
      SOLAR_PASSWORD: ${SOLAR_PASSWORD:-}
      SOLAR_SESSION_SECRET: ${SOLAR_SESSION_SECRET:-}
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
